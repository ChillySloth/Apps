name: NeoMusic APK

on:
  push:
    paths: ["NeoMusic/**", ".github/workflows/neomusic-android.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NeoMusic
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release APK
        run: ./gradlew :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: NeoMusic-apk
          path: NeoMusic/app/build/outputs/apk/release/app-release.apk
